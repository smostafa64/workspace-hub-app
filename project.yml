# The user-specific paths below are illustrative. Edit once per project.
project:
  id: WORKSPACE_HUB

# Maybe Java Maven, Gradle, multiple repos, or a deployed application.
# Not supplied to Architect or Writer. Used only for optional side effect probe and execution.
application:
  repository: .
  build_system: MAVEN  # MAVEN | GRADLE | NONE

interfaces:
  api_contract: docs/openapi.yaml # Optional; an actual interface contract improves automation
  base_url: http://localhost:8080 # Optional; never put credentials in this file

test_repositories:
  bdd:
    path: ../workspace-hub-qa
    framework: CUCUMBER_JAVA
    build_adapter: MAVEN_JUNIT
    test_types: [bdd, api, e2e]
  unit:
    path: src/test
    framework: JUNIT5
    build_adapter: MAVEN_JUNIT
    test_types: [unit]

execution:
  real_environment_required_for_production: true
  source_code_read_during_authoring: false
  preserve_candidate_identity: true
